<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>인파 영업·마케팅 실행판</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f3f5f9;
      --surface: #ffffff;
      --surface-2: #f4f6fa;
      --ink: #14171f;
      --ink-2: #475569;
      --ink-3: #6b7280;
      --line: #e6e9ef;
      --line-2: #cdd3dd;
      --brand: #2f58dc;
      --brand-ink: #22409e;
      --brand-tint: #e9eefc;
      --success: #3f7a48;
      --success-tint: #e7f1e9;
      --warning: #8a6418;
      --warning-tint: #fbf1dc;
      --danger: #9a2d28;
      --danger-tint: #fbeae9;
      --shadow: 0 1px 3px rgba(16, 24, 40, 0.06), 0 1px 2px rgba(16, 24, 40, 0.04);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { max-width: 100%; overflow-x: hidden; scroll-behavior: smooth; }
    body {
      max-width: 100%;
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; }
    button, input, select { min-height: 44px; }
    button { cursor: pointer; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid rgba(47, 88, 220, 0.28); outline-offset: 2px; }
    .skip-link {
      position: absolute;
      left: 12px;
      top: -80px;
      z-index: 100;
      background: var(--ink);
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
    }
    .skip-link:focus { top: 12px; }

    .app-shell { min-width: 0; min-height: 100vh; }
    .hero {
      background:
        radial-gradient(circle at 88% 15%, rgba(255,255,255,0.18), transparent 28%),
        linear-gradient(135deg, #22409e 0%, #2f58dc 58%, #5877e2 100%);
      color: #fff;
      padding: 28px clamp(18px, 5vw, 64px) 26px;
    }
    .hero-inner { max-width: 1540px; margin: 0 auto; }
    .eyebrow { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.08em; opacity: 0.82; }
    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
    }
    .hero-title-input,
    .hero-summary-input {
      width: 100%;
      border: 1px solid transparent;
      background: rgba(255,255,255,0.08);
      color: #fff;
      border-radius: 12px;
      padding: 8px 10px;
    }
    .hero-title-input {
      font-size: clamp(27px, 4vw, 44px);
      font-weight: 700;
      letter-spacing: -0.04em;
    }
    .hero-summary-input {
      min-height: 68px;
      margin-top: 6px;
      resize: vertical;
      line-height: 1.6;
    }
    .hero-title-input::placeholder,
    .hero-summary-input::placeholder { color: rgba(255,255,255,0.7); }
    .hero-title-input:hover,
    .hero-title-input:focus,
    .hero-summary-input:hover,
    .hero-summary-input:focus { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.13); }
    .hero-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
      align-items: center;
    }
    .hero-chip {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 6px 10px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      background: rgba(255,255,255,0.1);
      font-size: 13px;
    }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid var(--line-2);
      border-radius: 11px;
      background: var(--surface);
      color: var(--ink);
      padding: 9px 13px;
      font-weight: 650;
      text-decoration: none;
    }
    .btn:hover { background: var(--surface-2); }
    .btn-primary { border-color: var(--brand); background: var(--brand); color: #fff; }
    .btn-primary:hover { background: var(--brand-ink); }
    .btn-ghost { border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.1); color: #fff; }
    .btn-ghost:hover { background: rgba(255,255,255,0.17); }
    .btn-danger { border-color: #efc1be; background: var(--danger-tint); color: var(--danger); }
    .btn-small { min-height: 36px; padding: 6px 10px; font-size: 13px; }
    .icon { width: 18px; height: 18px; display: inline-block; }

    .section-nav-wrap {
      position: sticky;
      top: 0;
      z-index: 30;
      max-width: 100%;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(12px);
    }
    .section-nav {
      max-width: 1540px;
      margin: 0 auto;
      padding: 8px clamp(18px, 5vw, 64px);
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: thin;
    }
    .section-nav button {
      flex: 0 0 auto;
      min-height: 40px;
      border: 0;
      padding: 9px 12px;
      border-radius: 9px;
      background: transparent;
      color: var(--ink-2);
      font-size: 14px;
      font-weight: 650;
    }
    .section-nav button:hover { background: var(--brand-tint); color: var(--brand-ink); }
    .section-nav button[aria-selected="true"] { background: var(--brand); color: #fff; }
    .tab-panel[hidden] { display: none; }

    main {
      min-width: 0;
      max-width: 1540px;
      margin: 0 auto;
      padding: 26px clamp(18px, 5vw, 64px) 80px;
    }
    .section { min-width: 0; scroll-margin-top: 78px; margin-top: 32px; }
    .section:first-child { margin-top: 0; }
    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }
    .section-title { margin: 0; font-size: 24px; letter-spacing: -0.035em; }
    .section-desc { margin: 5px 0 0; color: var(--ink-3); line-height: 1.55; }
    .section-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }

    .card {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .card-body { padding: 18px; }
    .notice {
      display: none;
      margin: 0 0 16px;
      padding: 13px 15px;
      border: 1px solid #e8d3a2;
      border-radius: 12px;
      background: var(--warning-tint);
      color: var(--warning);
    }
    .notice.is-visible { display: block; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .summary-card { padding: 17px; }
    .summary-label { color: var(--ink-3); font-size: 13px; }
    .summary-value { display: block; margin-top: 8px; font-size: 29px; font-weight: 750; letter-spacing: -0.04em; }
    .summary-context { margin-top: 6px; color: var(--ink-2); font-size: 13px; }
    .summary-card.is-brand { background: var(--brand); border-color: var(--brand); color: #fff; }
    .summary-card.is-brand .summary-label,
    .summary-card.is-brand .summary-context { color: rgba(255,255,255,0.78); }

    .progress-track { height: 9px; overflow: hidden; border-radius: 999px; background: var(--surface-2); }
    .progress-bar { height: 100%; border-radius: inherit; background: var(--brand); transition: width 180ms ease; }
    .progress-bar.is-success { background: var(--success); }
    .progress-bar.is-warning { background: #d69a24; }
    .kpi-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; }
    .kpi-layout > * { min-width: 0; }
    .focus-card { padding: 18px; background: var(--brand-tint); border-color: #cad5f5; }
    .focus-card h3 { margin: 0 0 8px; color: var(--brand-ink); }
    .focus-card p { margin: 0; color: var(--ink-2); line-height: 1.6; }
    .focus-list { margin: 15px 0 0; padding-left: 20px; color: var(--ink-2); line-height: 1.7; }

    .table-wrap { width: 100%; max-width: 100%; overflow-x: auto; border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 11px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { background: var(--surface-2); color: var(--ink-2); font-size: 12px; font-weight: 750; white-space: nowrap; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr.is-done { background: #f4f9f5; }
    tbody tr.is-overdue { background: #fff9ed; }
    .num { font-variant-numeric: tabular-nums; text-align: right; }
    .nowrap { white-space: nowrap; }

    .field,
    .field-select,
    .field-area {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      padding: 7px 8px;
    }
    .field { min-width: 92px; }
    .field[type="number"] { min-width: 70px; text-align: right; }
    .field[type="date"] { min-width: 142px; }
    .field-select { min-width: 110px; }
    .field-area { min-width: 180px; min-height: 64px; resize: vertical; line-height: 1.45; }
    .field:hover, .field:focus,
    .field-select:hover, .field-select:focus,
    .field-area:hover, .field-area:focus { border-color: var(--line-2); background: #fff; }
    .field-compact { min-width: 64px; width: 72px; }
    .check-wrap { display: inline-grid; place-items: center; width: 44px; height: 44px; }
    .check-wrap input { width: 21px; height: 21px; accent-color: var(--brand); }

    .today-summary {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 15px 17px;
      margin-bottom: 12px;
      background: var(--brand-tint);
      border-color: #cad5f5;
    }
    .today-summary strong { color: var(--brand-ink); font-size: 20px; }
    .today-summary .progress-track { flex: 1 1 180px; }
    .checklist-stack { display: grid; gap: 10px; }
    .checklist-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .checklist-item.is-done { background: #f4f9f5; }
    .checklist-item.is-overdue { border-color: #e8d3a2; background: #fffaf0; }
    .checklist-complete {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--surface-2);
    }
    .checklist-complete input { width: 23px; height: 23px; accent-color: var(--brand); }
    .checklist-content { min-width: 0; }
    .checklist-action-input {
      width: 100%;
      min-height: 50px;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: var(--ink);
      font-size: 16px;
      font-weight: 750;
      line-height: 1.45;
      resize: vertical;
    }
    .checklist-action-input:hover, .checklist-action-input:focus { border-color: var(--line-2); background: #fff; }
    .checklist-fields {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .mini-control { display: grid; gap: 4px; min-width: 0; color: var(--ink-3); font-size: 11px; font-weight: 700; }
    .mini-control input, .mini-control select, .mini-control textarea {
      width: 100%;
      min-width: 0;
      min-height: 40px;
      padding: 7px 8px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
    }
    .mini-control textarea { resize: vertical; line-height: 1.4; }
    .checklist-actions { display: grid; gap: 6px; }
    .overdue-panel { margin-bottom: 14px; overflow: hidden; }
    .overdue-panel > summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px;
      cursor: pointer;
      color: var(--warning);
      font-weight: 750;
      list-style: none;
    }
    .overdue-panel .checklist-stack { padding: 0 14px 14px; }

    .calendar-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .calendar-month-title { margin: 0; font-size: 20px; letter-spacing: -0.03em; }
    .calendar-nav-actions { display: flex; flex-wrap: wrap; gap: 7px; }
    .calendar-scroll { width: 100%; max-width: 100%; overflow-x: auto; border-radius: var(--radius); }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      min-width: 980px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--line);
      gap: 1px;
      box-shadow: var(--shadow);
    }
    .calendar-weekday {
      padding: 10px 8px;
      background: var(--surface-2);
      color: var(--ink-2);
      text-align: center;
      font-size: 12px;
      font-weight: 750;
    }
    .calendar-weekday:first-child { color: var(--danger); }
    .calendar-day {
      min-width: 0;
      min-height: 148px;
      padding: 8px;
      background: var(--surface);
    }
    .calendar-day.is-outside { background: #fafbfc; }
    .calendar-day.is-outside .calendar-date-button, .calendar-day.is-outside .calendar-task { opacity: 0.48; }
    .calendar-day.is-selected { box-shadow: inset 0 0 0 2px var(--brand); }
    .calendar-day.is-today .calendar-date-button { background: var(--brand); color: #fff; }
    .calendar-date-button {
      min-width: 32px;
      min-height: 32px;
      padding: 4px 7px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--ink);
      font-weight: 750;
    }
    .calendar-tasks { display: grid; gap: 5px; margin-top: 5px; }
    .calendar-task {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      min-width: 0;
      padding: 6px 7px;
      border-radius: 8px;
      background: var(--brand-tint);
      color: var(--brand-ink);
      font-size: 11px;
      line-height: 1.35;
      cursor: pointer;
    }
    .calendar-task.is-done { background: var(--success-tint); color: var(--success); text-decoration: line-through; }
    .calendar-task input { flex: 0 0 auto; width: 16px; height: 16px; margin: 0; accent-color: var(--brand); }
    .calendar-task span { min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .calendar-more { margin: 5px 2px 0; color: var(--ink-3); font-size: 11px; font-weight: 700; }
    .calendar-detail { margin-top: 18px; }
    .calendar-detail-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .calendar-detail-head h3 { margin: 0; font-size: 19px; }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--ink-2);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge-brand { background: var(--brand-tint); color: var(--brand-ink); }
    .badge-success { background: var(--success-tint); color: var(--success); }
    .badge-warning { background: var(--warning-tint); color: var(--warning); }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: end;
      padding: 14px;
      margin-bottom: 12px;
    }
    .control { display: grid; gap: 5px; }
    .control label { color: var(--ink-3); font-size: 12px; font-weight: 700; }
    .control input, .control select {
      border: 1px solid var(--line-2);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      padding: 8px 10px;
    }
    .switch {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      gap: 8px;
      padding: 0 6px;
      color: var(--ink-2);
      font-weight: 650;
    }
    .switch input { width: 20px; height: 20px; accent-color: var(--brand); }

    .month-group { margin-top: 13px; }
    .month-group > summary,
    .scenario-card > summary,
    .review-card > summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 17px;
      font-weight: 750;
    }
    summary::-webkit-details-marker { display: none; }
    .month-group > summary::after,
    .scenario-card > summary::after,
    .review-card > summary::after { content: "펼치기"; color: var(--brand-ink); font-size: 12px; }
    details[open] > summary::after { content: "접기"; }
    .month-body, .scenario-body, .review-body { border-top: 1px solid var(--line); padding: 14px 17px 17px; }
    .empty-state { padding: 34px 18px; text-align: center; color: var(--ink-3); }

    .scenario-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .scenario-card { overflow: hidden; }
    .scenario-number {
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--brand-tint);
      color: var(--brand-ink);
      font-size: 12px;
    }
    .scenario-summary-main { display: flex; gap: 10px; align-items: center; min-width: 0; }
    .scenario-summary-main span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .form-grid .control textarea {
      width: 100%;
      min-height: 92px;
      border: 1px solid var(--line-2);
      border-radius: 10px;
      padding: 10px;
      resize: vertical;
      line-height: 1.5;
    }
    .form-grid .control.is-wide { grid-column: 1 / -1; }

    .review-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .review-card { overflow: hidden; }
    .review-fields { display: grid; gap: 10px; }
    .review-fields label { display: grid; gap: 5px; color: var(--ink-2); font-size: 13px; font-weight: 650; }
    .review-fields textarea { min-height: 76px; border: 1px solid var(--line-2); border-radius: 10px; padding: 10px; resize: vertical; line-height: 1.5; }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 60;
      max-width: min(420px, calc(100vw - 40px));
      padding: 12px 15px;
      border-radius: 11px;
      background: var(--ink);
      color: #fff;
      box-shadow: 0 12px 30px rgba(20,23,31,0.22);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: 160ms ease;
    }
    .toast.is-visible { opacity: 1; transform: none; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    .segmented { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
    .segmented button { min-height: 36px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); padding: 7px 11px; font-weight: 700; }
    .segmented button.is-active { background: var(--surface); color: var(--brand-ink); box-shadow: var(--shadow); }
    .target-filters { display: grid; grid-template-columns: minmax(220px, 2fr) repeat(5, minmax(130px, 1fr)); gap: 8px; margin-bottom: 12px; }
    .target-filters .field, .target-filters .field-select { width: 100%; }
    .target-primary { min-width: 250px; }
    .target-primary strong { display: block; margin-bottom: 4px; }
    .target-address { min-width: 290px; color: var(--ink-2); line-height: 1.45; }
    .target-address-actions, .route-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
    .target-score { display: inline-grid; place-items: center; min-width: 44px; min-height: 44px; border-radius: 999px; background: var(--success-tint); color: var(--success); font-weight: 800; }
    .target-mobile-list { display: none; gap: 10px; }
    .target-mobile-card { padding: 16px; }
    .target-mobile-card h3 { margin: 0; font-size: 17px; }
    .target-mobile-card p { margin: 7px 0 0; color: var(--ink-2); line-height: 1.5; }
    .route-decision { margin-bottom: 14px; padding: 18px; border-color: #cad5f5; background: var(--brand-tint); }
    .route-decision h3 { margin: 0 0 8px; color: var(--brand-ink); }
    .route-decision ol { margin: 0; padding-left: 22px; color: var(--ink-2); line-height: 1.75; }
    .route-overview { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
    .route-node { min-width: 0; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
    .route-node.is-selected { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(47,88,220,.12); }
    .route-node button { width: 100%; min-height: 0; border: 0; padding: 0; background: transparent; text-align: left; }
    .route-node strong, .route-node span { display: block; }
    .route-node span { margin-top: 5px; color: var(--ink-3); font-size: 12px; }
    .route-cluster-list { display: grid; gap: 12px; }
    .route-card { padding: 18px; }
    .route-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .route-card h3 { margin: 0; font-size: 18px; }
    .route-stop-list { margin: 13px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
    .route-stop { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px; border-radius: 11px; background: var(--surface-2); }
    .route-stop-order { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--brand); color: #fff; font-weight: 800; }
    .route-stop strong, .route-stop span { display: block; }
    .route-stop span { margin-top: 3px; color: var(--ink-3); font-size: 12px; }
    .monthly-goal-table td { min-width: 110px; }
    .source-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .source-card { padding: 14px; }
    .source-card h3 { margin: 0 0 7px; font-size: 16px; }
    .source-card p { margin: 4px 0; color: var(--ink-2); line-height: 1.5; }

    @media (max-width: 1100px) {
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .kpi-layout { grid-template-columns: minmax(0, 1fr); }
      .scenario-grid, .review-grid { grid-template-columns: minmax(0, 1fr); }
      .checklist-fields { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .target-filters { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .route-overview { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      .hero { padding: 22px 16px; }
      .hero-grid { grid-template-columns: 1fr; }
      .hero-summary-input { min-height: 116px; }
      .hero-actions { justify-content: flex-start; }
      .hero-actions .btn { flex: 1 1 132px; }
      .section-nav { padding: 7px 12px; }
      main { padding: 20px 14px 64px; }
      .section-head { align-items: flex-start; flex-direction: column; }
      .section-actions { width: 100%; justify-content: flex-start; }
      .section-actions .btn { flex: 1 1 140px; }
      .summary-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .summary-card { padding: 14px; }
      .summary-value { font-size: 24px; }
      .form-grid { grid-template-columns: 1fr; }
      .form-grid .control.is-wide { grid-column: auto; }
      .toolbar { align-items: stretch; }
      .control { flex: 1 1 145px; }
      .switch { flex: 1 1 100%; }
      .calendar-toolbar, .calendar-detail-head { align-items: flex-start; flex-direction: column; }
      .calendar-grid { min-width: 920px; }
      .checklist-item { grid-template-columns: auto minmax(0, 1fr); }
      .checklist-actions { grid-column: 2; display: flex; flex-wrap: wrap; }
      .checklist-fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .target-filters { grid-template-columns: 1fr 1fr; }
      .target-desktop-table { display: none; }
      .target-mobile-list { display: grid; }
      .route-overview, .source-list { grid-template-columns: 1fr; }
      .route-stop { grid-template-columns: 38px minmax(0, 1fr); }
      .route-stop .route-actions { grid-column: 2; }
      th, td { padding: 9px 8px; }
    }
    @media (max-width: 430px) {
      .summary-grid { grid-template-columns: 1fr; }
      .section-title { font-size: 21px; }
      .hero-actions .btn { flex-basis: 100%; }
    }

    @media print {
      @page { size: A4 landscape; margin: 10mm; }
      body { background: #fff; font-size: 10pt; }
      .hero { background: #fff; color: #000; padding: 0 0 10mm; }
      .hero-title-input, .hero-summary-input { color: #000; background: #fff; border: 0; padding: 0; }
      .hero-chip { color: #000; border-color: #aaa; background: #fff; }
      .hero-actions, .section-nav-wrap, .section-actions, .toolbar, .row-actions, .toast, .notice { display: none !important; }
      main { max-width: none; padding: 0; }
      .section { break-before: page; margin-top: 0; }
      #todaySection { break-before: auto; }
      .card, .month-group, .scenario-card, .review-card { box-shadow: none; break-inside: avoid; }
      .table-wrap { overflow: visible; }
      .calendar-scroll { overflow: visible; }
      .calendar-grid { min-width: 0; box-shadow: none; }
      .calendar-nav-actions, .checklist-actions { display: none !important; }
      table { font-size: 8pt; }
      .field, .field-select, .field-area, .review-fields textarea, .form-grid .control textarea { border: 0; padding: 2px; min-height: auto; }
      details:not([open]) > *:not(summary) { display: block; }
      details > summary::after { display: none; }
    }

      function parseDate(dateString) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(String(dateString || ""))) return null;
        const date = new Date(`${dateString}T12:00:00`);
        return Number.isNaN(date.getTime()) ? null : date;
      }

      function toDateString(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function addDays(dateString, days) {
        const date = parseDate(dateString);
        if (!date) return dateString;
        date.setDate(date.getDate() + days);
        return toDateString(date);
      }

      function daysBetween(start, end) {
        const startDate = parseDate(start);
        const endDate = parseDate(end);
        if (!startDate || !endDate) return Number.POSITIVE_INFINITY;
        return Math.floor((endDate.getTime() - startDate.getTime()) / 86400000);
      }

      function formatDate(dateString, includeYear = false) {
        const date = parseDate(dateString);
        if (!date) return dateString || "날짜 없음";
        return new Intl.DateTimeFormat("ko-KR", {
          year: includeYear ? "numeric" : undefined,
          month: "long",
          day: "numeric",
          weekday: "short"
        }).format(date);
      }

      function formatMonth(monthKey) {

          if (!raw) return buildDefaultState();
          return normalizeState(JSON.parse(raw));
        } catch (error) {
          try {
            const corrupt = window.localStorage.getItem(STORAGE_KEY);
            if (corrupt) window.localStorage.setItem(`${STORAGE_KEY}-recovery-${Date.now()}`, corrupt);
          } catch (_) {
            // The dashboard still works in memory when browser storage is unavailable.
          }
          window.setTimeout(() => {
            showStorageNotice("저장 내용을 읽는 과정에서 기본 계획을 열었습니다. 이전 값은 복구용으로 보관했고, JSON 백업으로 다시 불러올 수 있습니다.");
          }, 0);
          return buildDefaultState();
        }
      }

      function setSaveStatus(text) {
        const element = document.getElementById("saveStatus");
        if (element) element.textContent = text;
      }

      function saveState() {
        try {
          state.meta.lastSavedAt = new Date().toISOString();
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          const time = new Intl.DateTimeFormat("ko-KR", { hour: "2-digit", minute: "2-digit", second: "2-digit" }).format(new Date());
          setSaveStatus(`저장됨 ${time}`);
          showStorageNotice("");
        } catch (error) {
          setSaveStatus("브라우저 저장 확인 필요");
          showStorageNotice("이 브라우저에서는 자동 저장 범위가 제한될 수 있습니다. 상단의 JSON 백업을 함께 사용하면 내용을 안전하게 옮길 수 있습니다.");
        }
      }

      function queueSave() {
        setSaveStatus("저장 중");
        window.clearTimeout(saveTimer);
        saveTimer = window.setTimeout(saveState, 220);
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        if (!toast) return;
        toast.textContent = message;
        toast.classList.add("is-visible");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 2600);
      }

      function qualifiesFinalPartner(partner, campaignEnd = state?.meta?.endDate || CAMPAIGN_END) {
        const recentDays = daysBetween(partner.lastUsedAt, campaignEnd);
        return Number(partner.meaningfulWeeks) >= 6
          && Number(partner.coreFlows) >= 2
          && Number(partner.feedbackCount) >= 3
          && Number(partner.activeWeeksLast4) >= 3
          && recentDays >= 0
          && recentDays <= 30;
      }

      function calculateKpis(inputState) {
        const current = inputState || state;
        return current.kpis.map((kpi) => {
          let automaticActual = 0;
          if (kpi.source === "task") {
            automaticActual = current.tasks
              .filter((task) => task.metricId === kpi.id)
              .reduce((sum, task) => sum + (Number(task.actual) || 0), 0);
          } else if (kpi.source === "partner") {
            automaticActual = current.partners.filter((partner) => Boolean(partner[kpi.partnerField])).length;
          } else if (kpi.source === "final") {
            automaticActual = current.partners.filter((partner) => qualifiesFinalPartner(partner, current.meta.endDate)).length;
          }
          const hasOverride = kpi.manualActual !== "" && Number.isFinite(Number(kpi.manualActual));
          const actual = hasOverride ? Number(kpi.manualActual) : automaticActual;
          const target = Math.max(0, Number(kpi.target) || 0);
          const percent = target > 0 ? Math.round((actual / target) * 100) : 0;
          return {
            ...kpi,
            automaticActual,
            actual,
            target,
            percent,
            remaining: Math.max(0, target - actual),
            hasOverride
          };
        });
      }

      function completionRate() {
        if (!state.tasks.length) return 0;
        return Math.round((state.tasks.filter((task) => task.done).length / state.tasks.length) * 100);
      }

      function campaignDaysLeft() {
        const today = toDateString(new Date());
        if (today < state.meta.startDate) return Math.max(0, daysBetween(state.meta.startDate, state.meta.endDate) + 1);
        if (today > state.meta.endDate) return 0;
        return Math.max(0, daysBetween(today, state.meta.endDate) + 1);
      }

      function optionMarkup(options, selected) {
        return options.map((option) => `<option value="${escapeHtml(option)}"${option === selected ? " selected" : ""}>${escapeHtml(option)}</option>`).join("");

      function collectionControl(collection, id, field, value, options = {}) {
        const common = `data-collection="${collection}" data-id="${escapeHtml(id)}" data-field="${field}"`;
        if (options.type === "checkbox") {
          return `<label class="check-wrap"><span class="sr-only">${escapeHtml(options.label || field)}</span><input type="checkbox" ${common}${value ? " checked" : ""}></label>`;
        }
        if (options.type === "select") {
          return `<select class="field-select" ${common}>${optionMarkup(options.values, value)}</select>`;
        }
        if (options.type === "textarea") {
          return `<textarea class="field-area" ${common} aria-label="${escapeHtml(options.label || field)}">${escapeHtml(value)}</textarea>`;
        }
        const type = options.type || "text";
        const min = options.min !== undefined ? ` min="${options.min}"` : "";
        const step = options.step !== undefined ? ` step="${options.step}"` : "";
        const className = options.compact ? "field field-compact" : "field";
        return `<input class="${className}" type="${type}" value="${escapeHtml(value)}" ${common}${min}${step} aria-label="${escapeHtml(options.label || field)}">`;
      }

      function updateControl(element) {
        const field = element.dataset.field;
        if (!field) return false;
        const newValue = valueOf(element);
        if (element.dataset.scope === "meta") {
          state.meta[field] = newValue;
          if (field === "title") document.title = newValue || "인파 영업·마케팅 실행판";
          return true;
        }
        if (element.dataset.scope === "settings") {
          state.settings[field] = newValue;
          return true;
        }
        const collection = element.dataset.collection;
        const id = element.dataset.id;
        if (!collection || !id || !Array.isArray(state[collection])) return false;
        const item = state[collection].find((candidate) => candidate.id === id);
        if (!item) return false;
        item[field] = newValue;
        return true;
      }

      function rerenderAfterChange(element) {
        const scope = element.dataset.scope;
        const collection = element.dataset.collection;
        const field = element.dataset.field;
        if (scope === "settings") {
          if (["focusDate", "selectedDate"].includes(field)) {
            renderCalendar();
            renderTargets();
            renderPartners();
          } else if (["origin", "selectedCluster"].includes(field)) {
            renderLocations();
          } else {
            renderCalendar();
          }
          return;
        }
        if (scope === "meta") {
          if (["startDate", "endDate", "finalGoal"].includes(field)) renderAll();
          return;
        }
        if (collection === "tasks") {
          renderOverview();
          renderToday();
          renderCalendar();
          return;
        }
        if (collection === "kpis") {
          renderOverview();
          return;
        }
        if (collection === "targets") {
          renderTargets();
          renderLocations();
          return;
        }
        if (collection === "augustDailyActions") {
          const item = state.augustDailyActions.find((candidate) => candidate.id === element.dataset.id);
          const task = item ? state.tasks.find((candidate) => candidate.id === `task-${item.date}-spreadsheet`) : null;
          if (task) task.done = item.status === "완료";
          renderAugustExecution();
          renderToday();
          renderCalendar();
          return;
        }
        if (collection === "monthlyGoals") {
          renderMonthlyGoals();
          return;
        }
        if (collection === "partners") {
          renderOverview();
          renderPartners();
        }
      }

      function deleteRecord(collection, id) {
        if (!Array.isArray(state[collection])) return;

      function duplicateTask(id) {
        const source = state.tasks.find((task) => task.id === id);
        if (!source) return;
        const newDate = window.prompt("복제할 날짜를 YYYY-MM-DD로 입력하세요.", addDays(source.date, 1));
        if (!newDate || !parseDate(newDate)) {
          showToast("날짜를 확인한 뒤 다시 복제해 주세요.");
          return;
        }
        state.tasks.push({ ...source, id: uid("task"), date: newDate, actual: 0, done: false });
        state.tasks.sort((a, b) => a.date.localeCompare(b.date));
        saveState();
        renderToday();
        renderCalendar();
        renderOverview();
        showToast(`${formatDate(newDate)} 일정으로 복제했습니다.`);
      }

      function exportState() {
        const content = JSON.stringify(state, null, 2);
        const blob = new Blob([content], { type: "application/json;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = `inpa-sales-marketing-backup-${toDateString(new Date())}.json`;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        URL.revokeObjectURL(url);
        showToast("JSON 백업 파일을 만들었습니다.");
      }

      function importState(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.addEventListener("load", () => {
          try {
            const parsed = JSON.parse(String(reader.result || ""));
            const next = normalizeState(parsed);
            if (!Array.isArray(next.tasks) || !Array.isArray(next.scenarios)) throw new Error("invalid state");
            state = next;
            saveState();
            renderAll();
            showToast("백업 내용을 불러왔습니다.");
          } catch (error) {
            showToast("백업 파일의 내용을 확인해 주세요. 현재 실행판은 그대로 유지했습니다.");
          } finally {
            document.getElementById("importFile").value = "";
          }
        });
        reader.addEventListener("error", () => showToast("파일을 읽는 과정에서 멈췄습니다. 다른 백업 파일로 다시 시도해 주세요."));
        reader.readAsText(file, "utf-8");
      }

      function resetState() {
        if (!window.confirm("기본 계획으로 복원할까요? 현재 내용은 JSON 백업 후 복원하는 것을 권합니다.")) return;
        state = buildDefaultState();
        saveState();
        renderAll();
        showToast("기본 실행계획으로 복원했습니다.");
      }

      function selectCalendarDate(dateString) {
        if (!parseDate(dateString) || dateString < state.meta.startDate || dateString > state.meta.endDate) return;
        state.settings.selectedDate = dateString;
        state.settings.focusDate = dateString;
        state.settings.calendarMonth = dateString.slice(0, 7);
        state.settings.monthFilter = dateString.slice(0, 7);
        saveState();
        renderCalendar();
        renderTargets();
        renderPartners();
      }

      function moveCalendar(amount) {
        const minMonth = state.meta.startDate.slice(0, 7);
        const maxMonth = state.meta.endDate.slice(0, 7);
        const next = shiftMonth(state.settings.calendarMonth || minMonth, amount);
        state.settings.calendarMonth = next < minMonth ? minMonth : next > maxMonth ? maxMonth : next;
        saveState();
        renderCalendar();
      }

      function moveCalendarToToday() {
        const actualToday = toDateString(new Date());
        const date = actualToday >= state.meta.startDate && actualToday <= state.meta.endDate
          ? actualToday
          : getTodayPresentationDate(state, actualToday);
        selectCalendarDate(date);
      }

      function switchTab(tab, focus = false) {
        if (!["today", "targets", "planning", "locations", "scenarios"].includes(tab)) return;

        saveState();
        renderTabs();
        if (focus) document.getElementById(`${tab}Tab`)?.focus();
      }

      function setTargetView(view) {
        if (!["priority40", "all80"].includes(view)) return;
        state.settings.targetView = view;
        saveState();
        renderTargets();
      }

      function selectCluster(cluster) {
        if (!state.routeClusters.some((route) => route.cluster === cluster)) return;
        state.settings.selectedCluster = cluster;
        saveState();
        renderLocations();
      }

      function copyAddress(address) {
        const value = String(address || "").trim();
        if (!value) return;
        if (navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(value).then(() => showToast("주소를 복사했습니다.")).catch(() => showToast("주소를 선택해 복사해 주세요."));
          return;
        }
        const area = document.createElement("textarea");
        area.value = value;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.appendChild(area);
        area.select();
        try { document.execCommand("copy"); showToast("주소를 복사했습니다."); }
        catch (_) { showToast("주소를 선택해 복사해 주세요."); }
        area.remove();
      }

      function openTarget(id) {
        const target = state.targets.find((item) => item.id === id);
        if (!target) return;
        state.settings.targetView = "all80";
        state.settings.targetFilters = { ...state.settings.targetFilters, search: target.branch || target.company };
        state.settings.activeTab = "targets";
        saveState();
        renderTargets();
        renderTabs();
        document.getElementById("targetSection")?.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function setScenarioCategory(category) {
        const categories = ["전체", "첫 접촉", "관리직 미팅", "소개·출장", "사용·피드백", "온라인·확장"];
        if (!categories.includes(category)) return;
        state.settings.scenarioCategory = category;
        saveState();
        renderScenarios();
      }

      function handleAction(button) {
        const action = button.dataset.action;
        if (!action) return;
        if (action === "add-task") addTask(button.dataset.date);
        if (action === "add-target") addTarget();
        if (action === "add-partner") addPartner();
        if (action === "add-scenario") addScenario();
        if (action === "add-review") addReview();
        if (action === "delete-record") deleteRecord(button.dataset.collection, button.dataset.id);
        if (action === "duplicate-task") duplicateTask(button.dataset.id);
        if (action === "export") exportState();
        if (action === "import") document.getElementById("importFile").click();
        if (action === "print") window.print();
        if (action === "reset") resetState();
        if (action === "select-calendar-date") selectCalendarDate(button.dataset.date);
        if (action === "calendar-prev") moveCalendar(-1);
        if (action === "calendar-next") moveCalendar(1);
        if (action === "calendar-today") moveCalendarToToday();
        if (action === "switch-tab") switchTab(button.dataset.tab);
        if (action === "set-target-view") setTargetView(button.dataset.view);
        if (action === "select-cluster") selectCluster(button.dataset.cluster);
        if (action === "copy-address") copyAddress(button.dataset.address);
        if (action === "open-target") openTarget(button.dataset.id);
        if (action === "set-scenario-category") setScenarioCategory(button.dataset.category);
      }

      function bindEvents() {
        const root = document.getElementById("appRoot");
        root.addEventListener("input", (event) => {
          const filter = event.target.closest("[data-target-filter]");
          if (filter) {
            state.settings.targetFilters[filter.dataset.targetFilter] = filter.value;
            queueSave();
            return;
          }
          const element = event.target.closest("[data-field]");
          if (!element || !updateControl(element)) return;
          queueSave();
          if (element.dataset.scope === "settings" && element.dataset.field === "search") renderCalendar();
        });
        root.addEventListener("change", (event) => {
          const filter = event.target.closest("[data-target-filter]");
          if (filter) {
            state.settings.targetFilters[filter.dataset.targetFilter] = filter.value;
            saveState();
            renderTargets();
            return;
          }
          const element = event.target.closest("[data-field]");
          if (!element || !updateControl(element)) return;
          saveState();
          rerenderAfterChange(element);
        });
        root.addEventListener("click", (event) => {
          const button = event.target.closest("button[data-action]");
          if (button) handleAction(button);
        });
        document.getElementById("sectionNav").addEventListener("keydown", (event) => {
          if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
          const tabs = [...document.querySelectorAll("#sectionNav [role='tab']")];
          const currentIndex = tabs.indexOf(event.target);
          if (currentIndex < 0) return;
          event.preventDefault();
          const nextIndex = event.key === "Home" ? 0 : event.key === "End" ? tabs.length - 1 : event.key === "ArrowRight" ? (currentIndex + 1) % tabs.length : (currentIndex - 1 + tabs.length) % tabs.length;
          switchTab(tabs[nextIndex].dataset.tab, true);
        });
        document.getElementById("importFile").addEventListener("change", (event) => importState(event.target.files?.[0]));
      }

      function getState() {
        return state;
      }

      function setState(nextState) {
        state = normalizeState(nextState);
        renderAll();
      }

      state = loadState();
      window.InpaExecution = {
        storageKey: STORAGE_KEY,
        buildDefaultState,
        normalizeState,
        getState,
        setState,
        calculateKpis,
        saveState,
        qualifiesFinalPartner,
        buildMonthCells,
        getTodayPresentationDate,
        getOverdueTasks,
        buildOfficialTargets,
        buildMonthlyGoals,
        buildRouteClusters,
        getFilteredTargets,
        buildMapUrl,
        exportState,
        importState,
        resetState
      };
      renderAll();
      bindEvents();
    })();
  </script>
</body>
</html>
