    name: inpa-insurance-source-cleanup
    runtime: python
    plan: starter
    region: oregon
    rootDir: inpa_be
    schedule: "0 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py cleanup_insurance_imports
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: INSURANCE_REVIEW_GATE_ENABLED
