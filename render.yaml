# Render Blueprint — 인파 백엔드(inpa_be) Starter 배포.
# Render 작업공간은 Hobby 무료, inpa-be 컴퓨트만 Starter($7/월). DB는 Neon(무료 PostgreSQL) 외부 사용.
# 사용법: Render → New → Blueprint → 이 저장소 선택 → sync:false 변수(DATABASE_URL 등) 입력.
services:
  - type: web
    name: inpa-be
    runtime: python
    plan: starter
    region: oregon
    rootDir: inpa_be          # ★ FE/BE 한 저장소 — 백엔드 경로 지정(미설정 시 빌드 실패)
    healthCheckPath: /healthz/
    # [B] (선택) Render 영속 디스크로 미디어 영속 저장 — 유료 플랜·단일 인스턴스. 주석 해제 후
    #     envVars 의 MEDIA_DISK_PATH=/var/data/media 설정. (무료 플랜은 디스크 미지원 → R2 권장)
    # disk:
    #   name: inpa-media
    #   mountPath: /var/data
    #   sizeGB: 1
    # 빌드: 의존성 설치 + 정적파일 수집(whitenoise). collectstatic 은 prod.py 를 로드하므로
    #       빌드용 더미 SECRET_KEY/DATABASE_URL 주입(런타임엔 아래 envVars 의 실제 값 사용).
    buildCommand: >-
      pip install -r requirements.txt &&
      DATABASE_URL=postgres://build:build@localhost:5432/build
      SECRET_KEY=build-only-not-a-secret
      python manage.py collectstatic --noinput
    # 시작: 마이그레이션 → 표준담보/정규화 시드(멱등) → gunicorn. $PORT 는 Render 주입.
    #   ★ 2026-07-04 시드 안전화(LB-1): seed_normalization/seed_jobs 는 SeedMarker 버전
    #   가드로 보호 — 마커가 최신이면 no-op(배포·콜드스타트마다 실행돼도 무해).
    #   seed_normalization 은 identity-true upsert(자연키 get_or_create, PK 보존)라
    #   기존 M2M 링크·admin_verified 정규화 행이 끊기지 않는다. 삭제 없음(--prune 은
    #   수동 전용 — 배포 체인에서 사용 금지). 시드 데이터 변경 시 각 커맨드의
    #   SEED_VERSION 을 bump 하면 다음 배포에서 1회 재적재된다.
    #   @transaction.atomic 이라 실패 시 롤백 → 부분 적재 없음.
    #   ★ 이 변경 배포 직후 1회, Render Shell 에서 과거 끊긴 링크 복구(PM 런북):
    #       python manage.py repair_analysis_links --apply
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py createcachetable &&
      python manage.py seed_normalization &&
      python manage.py seed_jobs &&
      python manage.py seed_promotion &&
      python manage.py seed_billing &&
      python manage.py seed_boards &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true          # Render 가 강한 랜덤키 자동 생성(가드 통과)
      - key: DATABASE_URL
        sync: false                  # Neon 연결 문자열(postgres://...) 직접 입력
      - key: CORS_ALLOWED_ORIGINS
        sync: false                  # https://<vercel-fe-도메인>
      - key: ANTHROPIC_API_KEY
        sync: false                  # Claude 키(비우면 OCR/AI만 비활성)
      - key: CLAUDE_MODEL_PARSE
        sync: false                  # 모델 ID는 코드에 두지 않고 운영에서 주입
      - key: CLAUDE_MODEL_BULK
        sync: false                  # 대량 처리 모델 ID도 운영에서 주입
      - key: RECRUITING_ENABLED
        value: "True"                # 영업 > 설계사 영업 운영 공개
      - key: INSURANCE_REVIEW_GATE_ENABLED
        value: "False"               # 스테이징 평가와 PM 승인 전까지 검토형 경로 닫힘
      - key: HEATMAP_GRADING_ENABLED
        value: "True"                # 설계사가 직접 저장한 기준만 판정에 적용
      - key: CONSULTATION_RECORDING_ENABLED
        value: "True"                # 런타임+계정별 권한을 추가로 통과한 파일럿만 사용
      - key: CONSULTATION_AI_SUMMARY_ENABLED
        value: "True"                # 런타임+계정별 권한을 추가로 통과한 파일럿만 사용
      - key: CONSULTATION_SHOWCASE_PILOT_ENABLED
        value: "True"                # SHOWCASE_ACCOUNT_EMAIL의 상담 API에만 한정한 예외
      - key: CONSULTATION_AI_COMPARISON_ENABLED
        value: "True"                # 관리자 가상 상담 음성 A/B 비교 운영
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSCRIPTION_MODEL
        sync: false
      - key: OPENAI_CONSULTATION_TRANSCRIPTION_MODEL
        sync: false                  # 화자 구분 전용 모델 ID
      - key: OPENAI_COMPARISON_MODEL
        sync: false
      - key: OPENAI_CONSULTATION_SUMMARY_MODEL
        sync: false                  # 비우면 코드가 OPENAI_COMPARISON_MODEL을 사용
      - key: CONSULTATION_STT_PROVIDER
        value: "openai"
      - key: CONSULTATION_SUMMARY_PROVIDER
        value: "openai"
      - key: CONSULTATION_AI_REQUEST_TIMEOUT_SECONDS
        value: "180"
      - key: ANTHROPIC_COMPARISON_MODEL
        sync: false
      - key: CONSULTATION_COMPARISON_MAX_BYTES
        value: "26214400"
      - key: CONSULTATION_COMPARISON_MAX_DURATION_SECONDS
        value: "300"
      - key: CONSULTATION_COMPARISON_REQUEST_DEADLINE_SECONDS
        value: "110"
      - key: CONSULTATION_COMPARISON_CONNECT_TIMEOUT_SECONDS
        value: "2"
      - key: CONSULTATION_COMPARISON_TRANSCRIPTION_READ_TIMEOUT_SECONDS
        value: "35"
      - key: CONSULTATION_COMPARISON_SUMMARY_READ_TIMEOUT_SECONDS
        value: "25"
      - key: CONSULTATION_COMPARISON_WRITE_TIMEOUT_SECONDS
        value: "5"
      - key: CONSULTATION_COMPARISON_POOL_TIMEOUT_SECONDS
        value: "1"
      - key: BILLING_CARD_REGISTRATION_ENABLED
        value: "False"               # KICC 계약·실거래 검증과 PM 승인 전까지 카드 등록 닫힘
      - key: BILLING_RECURRING_CHARGE_ENABLED
        value: "False"               # 첫 결제 E2E·대사 검증 전까지 자동 승인 닫힘
      - key: BILLING_WEBHOOK_RECONCILIATION_ENABLED
        value: "False"               # KICC 조회·취소 운영 검증 전까지 정기결제 공개 닫힘
      - key: KICC_MALL_ID
        sync: false
      - key: KICC_CLIENT_SECRET
        sync: false
      - key: KICC_API_BASE_URL
        sync: false
      - key: PAYMENT_TOKEN_ENCRYPTION_KEY
        sync: false                  # Fernet 키. 분실 시 기존 결제키를 복호화할 수 없음
      - key: PAYMENT_TOKEN_KEY_VERSION
        value: "v1"
      - key: FREE_TRIAL_PHONE_VERIFICATION_ENABLED
        value: "False"               # SMS·개인정보 고지·실번호 검증과 PM 승인 전까지 닫힘
      - key: SOLAPI_API_KEY
        sync: false
      - key: SOLAPI_API_SECRET
        sync: false
      - key: SOLAPI_SENDER_NUMBER
        sync: false                  # SOLAPI에 등록된 숫자 전용 발신번호
      - key: PHONE_IDENTITY_HMAC_KEY
        sync: false                  # 원문 번호를 저장하지 않는 무작위 32-byte 이상 HMAC 키
      - key: PHONE_IDENTITY_HMAC_KEY_VERSION
        value: "v1"                  # 원장 재키잉 전에는 변경 금지
      - key: CONSULTATION_SUMMARY_ACTIVE_LIMIT
        value: "1"                   # 여러 서버·워커에서도 DB 잠금으로 동시에 한 건만 처리
      - key: CONSULTATION_SUMMARY_MODEL
        sync: false                  # 요약 모델 ID는 운영 환경에서만 주입
      - key: CONSULTATION_RETENTION_HOURS
        value: "720"                 # 신규 원본은 준비 완료 시각부터 정확히 30일 보관
      - key: CLOVA_SPEECH_INVOKE_URL
        sync: false
      - key: CLOVA_SPEECH_SECRET_KEY
        sync: false
      - key: BACKEND_BASE_URL
        sync: false                  # 예: https://inpa-be.onrender.com
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: inpa-insurance-queue
          property: connectionString
      - key: FRONTEND_BASE_URL
        sync: false                  # https://<vercel-fe-도메인> (이메일 링크용)
      # ── 일일 배치(리마인더 알림) — GitHub Actions cron(daily-jobs.yml)이 08:00 KST 에
      #    POST /api/v1/jobs/run-daily/ 를 호출. GitHub 저장소 Secret JOB_RUNNER_TOKEN 과
      #    "같은 값"을 여기에 입력해야 동작(미설정 시 엔드포인트 404 = 잡 꺼짐, fail-closed).
      - key: JOB_RUNNER_TOKEN
        sync: false                  # `openssl rand -hex 32` 등 강한 랜덤값. GH Secret 과 동일하게.
      - key: SHOWCASE_ACCOUNT_EMAIL
        sync: false
      - key: SHOWCASE_ACCOUNT_PASSWORD
        sync: false
      # ── 미디어(명함·전자자료) 저장 — AWS 불필요. 아래 셋 중 하나만 ──
      # [A] S3 "호환" 오브젝트 스토리지(권장·무료): Cloudflare R2 / Supabase / Backblaze B2 등.
      #     → 아래 5개 채우기(R2면 REGION=auto, ENDPOINT_URL=R2 주소).
      # [B] Render 영속 디스크(유료 플랜): 아래 disk 블록 주석 해제 + MEDIA_DISK_PATH 설정.
      # [C] 아무것도 안 채우면 로컬 임시(재배포 시 소실) — 개발/임시.
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false                  # [A] 버킷명. 채우면 오브젝트 스토리지 사용
      - key: AWS_S3_REGION_NAME
        sync: false                  # [A] AWS면 ap-northeast-2, Cloudflare R2면 auto
      - key: AWS_ACCESS_KEY_ID
        sync: false                  # [A] 액세스 키
      - key: AWS_SECRET_ACCESS_KEY
        sync: false                  # [A] 시크릿 키
      - key: AWS_S3_ENDPOINT_URL
        sync: false                  # [A] R2/B2/Supabase 엔드포인트(AWS S3면 비움)
      # ── 상담 녹음 전용 비공개 R2. consultation-recordings/에 30일 lifecycle 적용 ──
      - key: CONSULTATION_STORAGE_BUCKET
        sync: false
      - key: CONSULTATION_STORAGE_ENDPOINT
        sync: false
      - key: CONSULTATION_STORAGE_REGION
        value: "auto"
      - key: CONSULTATION_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: CONSULTATION_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: MEDIA_DISK_PATH
        sync: false                  # [B] Render 디스크 마운트 경로(예: /var/data/media)
      # ALLOWED_HOSTS·CSRF 는 Render 가 RENDER_EXTERNAL_HOSTNAME 주입 → prod.py 가 자동 포함.
      # 커스텀 도메인 붙이면 ALLOWED_HOSTS·CSRF_TRUSTED_ORIGINS 를 여기에 추가.
      # 이메일(Resend) 쓸 때: EMAIL_BACKEND/EMAIL_HOST/EMAIL_PORT/EMAIL_HOST_USER/EMAIL_HOST_PASSWORD/EMAIL_USE_SSL/DEFAULT_FROM_EMAIL 추가.

  # 보험증권 가져오기 전용 큐. Blueprint를 동기화하기 전 비용·운영 승인이 필요하다.
  - type: keyvalue
    name: inpa-insurance-queue
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

  - type: worker
    name: inpa-insurance-worker
    runtime: python
    # 동시 4건의 PDF 격리 프로세스를 감당하도록 2GB/1CPU를 사용한다.
    plan: standard
    region: oregon
    rootDir: inpa_be
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker -l INFO -Q insurance_imports,consultation_summaries --concurrency 4
    maxShutdownDelaySeconds: 300
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: INSURANCE_REVIEW_GATE_ENABLED
        value: "False"
      - key: CONSULTATION_AI_SUMMARY_ENABLED
        fromService:
          type: web
          name: inpa-be
          envVarKey: CONSULTATION_AI_SUMMARY_ENABLED
      - key: CONSULTATION_SHOWCASE_PILOT_ENABLED
        fromService:
          type: web
          name: inpa-be
          envVarKey: CONSULTATION_SHOWCASE_PILOT_ENABLED
      - key: SHOWCASE_ACCOUNT_EMAIL
        fromService:
          type: web
          name: inpa-be
          envVarKey: SHOWCASE_ACCOUNT_EMAIL
      - key: BILLING_CARD_REGISTRATION_ENABLED
        fromService:
          type: web
          name: inpa-be
          envVarKey: BILLING_CARD_REGISTRATION_ENABLED
      - key: BILLING_RECURRING_CHARGE_ENABLED
        fromService:
          type: web
          name: inpa-be
          envVarKey: BILLING_RECURRING_CHARGE_ENABLED
      - key: BILLING_WEBHOOK_RECONCILIATION_ENABLED
        fromService:
          type: web
          name: inpa-be
          envVarKey: BILLING_WEBHOOK_RECONCILIATION_ENABLED
      - key: KICC_MALL_ID
        fromService:
          type: web
          name: inpa-be
          envVarKey: KICC_MALL_ID
      - key: KICC_CLIENT_SECRET
        fromService:
          type: web
          name: inpa-be
          envVarKey: KICC_CLIENT_SECRET
      - key: KICC_API_BASE_URL
        fromService:
          type: web
          name: inpa-be
          envVarKey: KICC_API_BASE_URL
      - key: PAYMENT_TOKEN_ENCRYPTION_KEY
        fromService:
          type: web
          name: inpa-be
          envVarKey: PAYMENT_TOKEN_ENCRYPTION_KEY
      - key: PAYMENT_TOKEN_KEY_VERSION
        fromService:
          type: web
          name: inpa-be
          envVarKey: PAYMENT_TOKEN_KEY_VERSION
      - key: CONSULTATION_SUMMARY_ACTIVE_LIMIT
        fromService:
          type: web
          name: inpa-be
          envVarKey: CONSULTATION_SUMMARY_ACTIVE_LIMIT
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: inpa-insurance-queue
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: inpa-be
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromService:
          type: web
          name: inpa-be
          envVarKey: DATABASE_URL
      - key: ANTHROPIC_API_KEY
        fromService:
          type: web
          name: inpa-be
          envVarKey: ANTHROPIC_API_KEY
      - key: CLAUDE_MODEL_PARSE
        fromService:
          type: web
          name: inpa-be
          envVarKey: CLAUDE_MODEL_PARSE
      - key: CLAUDE_MODEL_BULK
        fromService:
          type: web
          name: inpa-be
          envVarKey: CLAUDE_MODEL_BULK
      - key: CONSULTATION_SUMMARY_MODEL
        fromService:
          type: web
          name: inpa-be
          envVarKey: CONSULTATION_SUMMARY_MODEL
      - key: CONSULTATION_STT_PROVIDER
        fromService:
          type: web
          name: inpa-be
          envVarKey: CONSULTATION_STT_PROVIDER
      - key: CONSULTATION_SUMMARY_PROVIDER
        fromService:
          type: web
          name: inpa-be
          envVarKey: CONSULTATION_SUMMARY_PROVIDER
      - key: CONSULTATION_AI_REQUEST_TIMEOUT_SECONDS
        fromService:
          type: web
          name: inpa-be
          envVarKey: CONSULTATION_AI_REQUEST_TIMEOUT_SECONDS
      - key: OPENAI_API_KEY
        fromService:
          type: web
          name: inpa-be
          envVarKey: OPENAI_API_KEY
      - key: OPENAI_TRANSCRIPTION_MODEL
        fromService:
          type: web
          name: inpa-be
          envVarKey: OPENAI_TRANSCRIPTION_MODEL
      - key: OPENAI_CONSULTATION_TRANSCRIPTION_MODEL
        fromService:
          type: web
          name: inpa-be
          envVarKey: OPENAI_CONSULTATION_TRANSCRIPTION_MODEL
      - key: OPENAI_COMPARISON_MODEL
        fromService:
          type: web
          name: inpa-be
          envVarKey: OPENAI_COMPARISON_MODEL
      - key: OPENAI_CONSULTATION_SUMMARY_MODEL
        fromService:
          type: web
          name: inpa-be
          envVarKey: OPENAI_CONSULTATION_SUMMARY_MODEL
      - key: CONSULTATION_RETENTION_HOURS
        fromService:
          type: web
          name: inpa-be
          envVarKey: CONSULTATION_RETENTION_HOURS
      - key: CLOVA_SPEECH_INVOKE_URL
        fromService:
          type: web
          name: inpa-be
          envVarKey: CLOVA_SPEECH_INVOKE_URL
      - key: CLOVA_SPEECH_SECRET_KEY
        fromService:
          type: web
          name: inpa-be
          envVarKey: CLOVA_SPEECH_SECRET_KEY
      - key: BACKEND_BASE_URL
        fromService:
          type: web
          name: inpa-be
          envVarKey: BACKEND_BASE_URL
      - key: CONSULTATION_STORAGE_BUCKET
        fromService:
          type: web
          name: inpa-be
          envVarKey: CONSULTATION_STORAGE_BUCKET
      - key: CONSULTATION_STORAGE_ENDPOINT
        fromService:
